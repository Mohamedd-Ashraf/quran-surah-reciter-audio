name: Ayah Word Alignment

on:
  workflow_dispatch:
    inputs:
      reciter_id:
        description: EveryAyah reciter id (e.g. ar.alijaber, ar.alafasy). Must exist in noor/tool/ayah_word_alignment/reciters.yaml
        required: true
        type: string
        default: ar.alijaber
      surahs:
        description: Surah range (e.g. 1,2,112-114 or 1-114)
        required: true
        type: string
        default: "1,2,112-114"
      force_rebuild:
        description: Rebuild even if valid JSON exists
        required: false
        type: boolean
        default: false
      shard_count:
        description: Parallel shards (use 19 for full 1-114 mushaf)
        required: false
        type: number
        default: 19
      only_ayahs:
        description: Optional comma list e.g. 2:255 (Ayat al-Kursi). Empty = all ayahs in surahs range.
        required: false
        type: string
        default: ""
      align_mode:
        description: "Strategy search: fast (throughput), balanced (default quality+speed), max (try all)"
        required: false
        type: choice
        options:
          - balanced
          - fast
          - max
        default: balanced
      max_fail_rate:
        description: Max failure rate before merge gate fails
        required: false
        type: string
        default: "0.05"
      commit_tree:
        description: Commit word-alignment/{reciterId}/{surah}/{ayah}.json into this repo (not Releases)
        required: false
        type: boolean
        default: true
      enable_timing_analysis:
        description: Attach duration, Madd-candidate, and safe-stretch metadata (default on). Disable to keep classic JSON only.
        required: false
        type: boolean
        default: true

concurrency:
  group: ayah-align-${{ inputs.reciter_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: "3.11"
  ALIGN_MODEL: jonatasgrosman/wav2vec2-large-xlsr-53-arabic
  TOOL_ROOT: noor/tool/ayah_word_alignment
  GIT_AUTHOR_NAME: Mohamedd-Ashraf
  GIT_AUTHOR_EMAIL: 110347603+Mohamedd-Ashraf@users.noreply.github.com
  GIT_COMMITTER_NAME: Mohamedd-Ashraf
  GIT_COMMITTER_EMAIL: 110347603+Mohamedd-Ashraf@users.noreply.github.com

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    outputs:
      shard_matrix: ${{ steps.matrix.outputs.shard_matrix }}
    steps:
      - id: matrix
        run: |
          python3 - <<'PY'
          import json, os
          n = int("""${{ inputs.shard_count }}""")
          n = max(1, min(n, 19))
          matrix = {"include": [{"shard_index": i, "shard_count": n} for i in range(n)]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"shard_matrix={json.dumps(matrix)}\n")
          print(matrix)
          PY

  align:
    name: Align shard ${{ matrix.shard_index }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.shard_matrix) }}
    steps:
      - name: Checkout dest (resume from word-alignment/)
        uses: actions/checkout@v4

      - name: Checkout private alignment tool
        uses: actions/checkout@v4
        with:
          repository: Mohamedd-Ashraf/Noor-Al-Imaan
          token: ${{ secrets.NOOR_READ_TOKEN }}
          path: noor
          sparse-checkout: tool/ayah_word_alignment
          sparse-checkout-cone-mode: true

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: noor/tool/ayah_word_alignment/requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.ALIGN_MODEL }}-${{ hashFiles('noor/tool/ayah_word_alignment/requirements.txt') }}
          restore-keys: |
            hf-${{ env.ALIGN_MODEL }}-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r "$TOOL_ROOT/requirements.txt"
          pip install "git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git"

      - name: Restore prior alignment JSON from repo tree (resume)
        if: ${{ inputs.force_rebuild != true }}
        continue-on-error: true
        run: |
          set -e
          ED="${{ inputs.reciter_id }}"
          SRC="word-alignment/$ED"
          DEST="build/word_alignment/alignment/$ED"
          mkdir -p "$DEST"
          if [ -d "$SRC" ]; then
            find "$SRC" -type f -name '*.json' ! -name '_meta.json' | while read -r f; do
              rel="${f#$SRC/}"
              mkdir -p "$DEST/$(dirname "$rel")"
              cp -f "$f" "$DEST/$rel"
            done
            echo "Restored $(find "$DEST" -type f -name '*.json' | wc -l) prior files"
          else
            echo "No prior tree at $SRC"
          fi

      - name: Run shard
        run: |
          FORCE=""
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then FORCE="--force-rebuild"; fi
          ONLY=""
          if [ -n "${{ inputs.only_ayahs }}" ]; then ONLY="--only-ayahs ${{ inputs.only_ayahs }}"; fi
          TIMING="--enable-timing-analysis"
          if [ "${{ inputs.enable_timing_analysis }}" = "false" ]; then TIMING="--no-timing-analysis"; fi
          python "$TOOL_ROOT/runner/run_shard.py" \
            --reciter-id "${{ inputs.reciter_id }}" \
            --surahs "${{ inputs.surahs }}" \
            $ONLY \
            --shard-index "${{ matrix.shard_index }}" \
            --shard-count "${{ matrix.shard_count }}" \
            --align-mode "${{ inputs.align_mode }}" \
            --output-root build/word_alignment/alignment \
            --failed-root build/word_alignment/failed \
            --tmp-dir build/word_alignment/tmp \
            --model "$ALIGN_MODEL" \
            $FORCE \
            $TIMING

      - name: Upload shard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: align-${{ inputs.reciter_id }}-shard${{ matrix.shard_index }}
          path: |
            build/word_alignment/alignment/${{ inputs.reciter_id }}/**
            build/word_alignment/failed/summary_shard${{ matrix.shard_index }}.json
            build/word_alignment/failed/failures_shard${{ matrix.shard_index }}.csv
            build/word_alignment/failed/${{ inputs.reciter_id }}/**
          if-no-files-found: warn
          retention-days: 14

  merge:
    name: Merge / sync tree / gate
    needs: align
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout dest
        uses: actions/checkout@v4

      - name: Checkout private alignment tool
        uses: actions/checkout@v4
        with:
          repository: Mohamedd-Ashraf/Noor-Al-Imaan
          token: ${{ secrets.NOOR_READ_TOKEN }}
          path: noor
          sparse-checkout: tool/ayah_word_alignment
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: align-${{ inputs.reciter_id }}-shard*
          path: build/word_alignment/shards
          merge-multiple: true

      - name: Assemble tree, merge reports, sync word-alignment/
        run: |
          set -e
          ED="${{ inputs.reciter_id }}"
          mkdir -p "build/word_alignment/alignment/$ED" build/word_alignment/failed
          if [ -d build/word_alignment/shards/alignment ]; then
            cp -a build/word_alignment/shards/alignment/. build/word_alignment/alignment/
          fi
          find build/word_alignment/shards -name 'summary_shard*.json' -exec cp {} build/word_alignment/failed/ \; || true
          find build/word_alignment/shards -name 'failures_shard*.csv' -exec cp {} build/word_alignment/failed/ \; || true
          find build/word_alignment/shards -type d -name "$ED" | while read d; do
            case "$d" in
              */alignment/*) cp -a "$d/." "build/word_alignment/alignment/$ED/" ;;
              */failed/*) mkdir -p "build/word_alignment/failed/$ED"; cp -a "$d/." "build/word_alignment/failed/$ED/" ;;
            esac
          done
          shopt -s nullglob
          for f in build/word_alignment/shards/*.json; do
            base=$(basename "$f")
            [[ "$base" == summary* ]] && continue
            cp -f "$f" "build/word_alignment/alignment/$ED/$base"
          done
          pip install -q pyyaml requests
          python "$TOOL_ROOT/runner/merge_reports.py" \
            --failed-root build/word_alignment/failed \
            --max-fail-rate "${{ inputs.max_fail_rate }}" \
            --no-gate
          if [ "${{ inputs.enable_timing_analysis }}" != "false" ]; then
            python "$TOOL_ROOT/runner/enrich_timing.py" \
              --alignment-root "build/word_alignment/alignment/$ED" \
              --config "$TOOL_ROOT/reciters.yaml" \
              --enable-timing-analysis
          fi
          python "$TOOL_ROOT/runner/sync_tree.py" \
            --alignment-root "build/word_alignment/alignment/$ED" \
            --tree-dir . \
            --reciter-id "$ED"

      - name: Upload alignment artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-alignment-tree-${{ inputs.reciter_id }}
          path: |
            word-alignment/${{ inputs.reciter_id }}/**
            build/word_alignment/failed/summary.json
            build/word_alignment/failed/failures.csv
          retention-days: 30

      - name: Commit word-alignment tree to repo
        if: ${{ inputs.commit_tree == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ED="${{ inputs.reciter_id }}"
          git add "word-alignment/_index.json"
          chmod +x "$TOOL_ROOT/scripts/commit_alignment_tree.sh"
          bash "$TOOL_ROOT/scripts/commit_alignment_tree.sh" "$ED"
          if ! git diff --cached --quiet; then
            git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" \
              -m "chore(word-alignment): update $ED [skip ci]"
            git push
          fi

      - name: Fail-rate gate
        run: |
          python "$TOOL_ROOT/runner/merge_reports.py" \
            --failed-root build/word_alignment/failed \
            --max-fail-rate "${{ inputs.max_fail_rate }}"
